services:
  caddy:
    build: ./caddy
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - ACME_EMAIL=${ACME_EMAIL}
      - DOMAIN=${DOMAIN}
      - CROWDSEC_API_KEY=${CROWDSEC_API_KEY}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/data:/data/caddy
      - caddy-logs:/var/log/caddy
    dns:
      - 172.20.0.53
    networks:
      - proxy
    depends_on:
      crowdsec:
        condition: service_healthy

  frps:
    image: fatedier/frps:v0.71.0
    container_name: frps
    restart: always
    command: ["-c", "/etc/frp/frps.toml"]
    ports:
      - "7000:7000"
    volumes:
      - ./frps/frps.toml:/etc/frp/frps.toml
    networks:
      - proxy

  adguard:
    image: adguard/adguardhome:v0.107.79
    container_name: adguard
    restart: always
    ports:
      - "853:853/tcp"
    volumes:
      - ./adguard/data/work:/opt/adguardhome/work
      - ./adguard/data/conf:/opt/adguardhome/conf
      - ${CADDY_CERTS_PATH}:/certs:ro
    networks:
      proxy:
        ipv4_address: 172.20.0.53

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.3
    container_name: uptime-kuma
    restart: always
    volumes:
      - ./uptime-kuma/data:/app/data
    networks:
      - proxy

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.0
    container_name: crowdsec
    restart: always
    environment:
      - COLLECTIONS=crowdsecurity/caddy crowdsecurity/http-cve
      - BOUNCER_KEY_caddy=${CROWDSEC_API_KEY}
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./crowdsec/data:/var/lib/crowdsec/data
      - caddy-logs:/var/log/caddy:ro
    healthcheck:
      test:
        - CMD
        - cscli
        - lapi
        - status
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - proxy

networks:
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  caddy-logs:
