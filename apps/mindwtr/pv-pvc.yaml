apiVersion: v1
kind: PersistentVolume
metadata:
  name: mindwtr-pv
  namespace: mindwtr
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  claimRef:
    name: mindwtr-pvc
    namespace: mindwtr
  hostPath:
    path: "/data/mindwtr"
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mindwtr-pvc
  namespace: mindwtr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
