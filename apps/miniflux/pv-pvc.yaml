apiVersion: v1
kind: PersistentVolume
metadata:
  name: miniflux-postgres-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  claimRef:
    name: miniflux-postgres-pvc
    namespace: miniflux
  hostPath:
    path: /data/miniflux/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: miniflux-postgres-pvc
  namespace: miniflux
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
