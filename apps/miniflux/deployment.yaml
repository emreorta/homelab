apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: miniflux
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: miniflux
  template:
    metadata:
      labels:
        app: miniflux
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      nodeSelector:
        kubernetes.io/hostname: k3s-2
      initContainers:
        - name: wait-for-db
          image: postgres:18.6
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h miniflux-postgres -U miniflux; do sleep 2; done
      containers:
        - name: miniflux
          image: quay.io/miniflux/miniflux:2.3.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: miniflux-db
                  key: DATABASE_URL
            - name: RUN_MIGRATIONS
              value: "1"
            - name: CREATE_ADMIN
              value: "1"
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: miniflux-app
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: miniflux-app
                  key: ADMIN_PASSWORD
            - name: OAUTH2_PROVIDER
              value: oidc
            - name: OAUTH2_CLIENT_ID
              value: miniflux
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: miniflux-app
                  key: OAUTH2_CLIENT_SECRET
            - name: OAUTH2_REDIRECT_URL
              value: https://rss.${DOMAIN}/oauth2/oidc/callback
            - name: OAUTH2_OIDC_DISCOVERY_ENDPOINT
              value: https://auth.${DOMAIN}
            - name: OAUTH2_USER_CREATION
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
