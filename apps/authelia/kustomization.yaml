apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - pv-pvc.yaml
  - secrets.yaml
  - ingress.yaml

configMapGenerator:
  - name: authelia-config
    namespace: authelia
    files:
      - configuration.yml=configuration.yaml
  - name: authelia-oidc-clients
    namespace: authelia
    files:
      - oidc-clients.yml=oidc-clients.yaml
