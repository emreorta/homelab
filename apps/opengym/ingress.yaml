apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opengym
  namespace: traefik
spec:
  entryPoints:
    - frp
  routes:
    - match: Host(`gym.${DOMAIN}`)
      kind: Rule
      middlewares:
        - name: frp-headers
          namespace: traefik
      services:
        - name: opengym
          port: 80
          namespace: opengym
