apiVersion: v1
kind: PersistentVolume
metadata:
  name: lldap-pv
  namespace: lldap
spec:
  capacity:
    storage: 500Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  claimRef:
    name: lldap-pvc
    namespace: lldap
  hostPath:
    path: "/data/lldap"
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lldap-pvc
  namespace: lldap
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
