apiVersion: apps/v1
kind: Deployment
metadata:
  name: norish-redis
  namespace: norish
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: norish-redis
  template:
    metadata:
      labels:
        app: norish-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      nodeSelector:
        kubernetes.io/hostname: k3s-controlplane
      containers:
        - name: redis
          image: redis:8.10.2-alpine
          imagePullPolicy: IfNotPresent
          args:
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: norish-redis-pvc
