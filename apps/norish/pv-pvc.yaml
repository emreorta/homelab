apiVersion: v1
kind: PersistentVolume
metadata:
  name: norish-postgres-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  claimRef:
    name: norish-postgres-pvc
    namespace: norish
  hostPath:
    path: /data/norish/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-controlplane
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: norish-postgres-pvc
  namespace: norish
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
