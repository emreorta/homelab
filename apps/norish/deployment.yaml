apiVersion: apps/v1
kind: Deployment
metadata:
  name: norish
  namespace: norish
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: norish
  template:
    metadata:
      labels:
        app: norish
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      nodeSelector:
        kubernetes.io/hostname: k3s-controlplane
      initContainers:
        - name: wait-for-db
          image: postgres:18.6
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h norish-postgres -U norish; do sleep 2; done
        - name: wait-for-redis
          image: redis:8.10.2-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until redis-cli -h norish-redis ping; do sleep 2; done
      containers:
        - name: norish
          image: norishapp/norish:v0.24.0-beta
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: AUTH_URL
              value: https://norish.${DOMAIN}
            - name: TZ
              value: Europe/Berlin
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: norish-db
                  key: DATABASE_URL
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: norish-app
                  key: MASTER_KEY
            - name: REDIS_URL
              value: redis://norish-redis:6379
            - name: OBSCURA_ENDPOINT
              value: ws://norish-obscura:9222
            - name: UPLOADS_DIR
              value: /app/uploads
            - name: PASSWORD_AUTH_ENABLED
              value: "false"
            - name: OIDC_NAME
              value: Authelia
            - name: OIDC_ISSUER
              value: https://auth.${DOMAIN}
            - name: OIDC_CLIENT_ID
              value: norish
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: norish-app
                  key: OIDC_CLIENT_SECRET
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: norish-uploads-pvc
