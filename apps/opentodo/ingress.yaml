apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opentodo
  namespace: traefik
spec:
  entryPoints:
    - frp
  routes:
    - match: Host(`todos.${DOMAIN}`)
      kind: Rule
      middlewares:
        - name: frp-headers
          namespace: traefik
      services:
        - name: opentodo
          port: 8080
          namespace: opentodo
