apiVersion: v1
kind: PersistentVolume
metadata:
  name: silverbullet-pv
  namespace: silverbullet
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  claimRef:
    name: silverbullet-pvc
    namespace: silverbullet
  hostPath:
    path: "/data/silverbullet"
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: silverbullet-pvc
  namespace: silverbullet
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
