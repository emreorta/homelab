apiVersion: apps/v1
kind: Deployment
metadata:
  name: dozzle
  namespace: dozzle
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dozzle
  template:
    metadata:
      labels:
        app: dozzle
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      serviceAccountName: pod-viewer
      nodeSelector:
        kubernetes.io/hostname: k3s-3
      containers:
        - name: dozzle
          image: amir20/dozzle:v11.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DOZZLE_MODE
              value: "k8s"
            - name: DOZZLE_AUTH_PROVIDER
              value: "oidc"
            - name: DOZZLE_AUTH_OIDC_ISSUER
              value: "https://auth.${DOMAIN}"
            - name: DOZZLE_AUTH_OIDC_CLIENT_ID
              value: "dozzle"
            - name: DOZZLE_AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dozzle-app
                  key: OIDC_CLIENT_SECRET
            - name: DOZZLE_AUTH_OIDC_SCOPES
              value: "dozzle_roles"
          resources:
            requests:
              cpu: "150m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
